// ================= GLOBAL TOOLTIP (fixed-position; never clipped by scroll containers) =================
document.addEventListener("mouseover", e=>{
  const t = e.target.closest(".info");
  if(!t) return;
  const tip = document.getElementById("gtip");
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
  positionTip(e);
});
document.addEventListener("mousemove", e=>{
  if(document.getElementById("gtip").style.display==="block" && e.target.closest(".info")) positionTip(e);
});
document.addEventListener("mouseout", e=>{
  if(e.target.closest && e.target.closest(".info")) document.getElementById("gtip").style.display="none";
});
function positionTip(e){
  const tip=document.getElementById("gtip");
  const pad=14;
  let x=e.clientX+pad, y=e.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-pad;
  if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-pad;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}

});
